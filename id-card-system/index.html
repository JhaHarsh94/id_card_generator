<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3B2A8C" />
    <!--
      Devanagari webfont is SELF-HOSTED from /public/fonts (see src/styles/fonts.css).
      Self-hosting is deliberate: html-to-image must be able to read and embed the
      @font-face rules when exporting a card, and it cannot read a cross-origin
      stylesheet. With the Google Fonts CDN the exported PNG silently fell back
      to a wider system face, which made long member names wrap and collide.
    -->
    <meta
      name="description"
      content="Digital ID card management and QR verification system."
    />
    <title>ID Card Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
